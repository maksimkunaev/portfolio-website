    <line x1="46" y1="21" x2="32" y2="46" stroke="#5fd4e8"/>
  </g>
  <circle cx="18" cy="21" r="7" fill="#111725" stroke="#8e9bb3" stroke-width="4"/>
  <circle cx="46" cy="21" r="7" fill="#111725" stroke="#8e9bb3" stroke-width="4"/>
  <circle cx="32" cy="46" r="8" fill="#5fd4e8"/>

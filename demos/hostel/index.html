<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hostel — a world made of modules</title>
<style>
/* layout: full-screen 3D canvas, goal card top-left, plan card bottom-left */
:root{
  --bg:#10141c; --panel:#1a2130f2; --fg:#e8edf6; --dim:#8593ab;
  --accent:#ffb347; --open:#4cd97b; --shut:#ff5d5d; --line:#2c3648;
}
:root{color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.45 "Golos Text",system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;display:block}
.card{position:fixed;right:16px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;backdrop-filter:blur(6px);width:290px;z-index:2}
#ctrl{top:calc(16px + env(safe-area-inset-top,0px))}
#plan{bottom:calc(16px + env(safe-area-inset-bottom,0px));max-height:44vh;overflow-y:auto;
  font:12px/1.6 ui-monospace,Menlo,monospace}
h1{font-size:15px;margin:0 0 2px;font-weight:600}
.sub{color:var(--dim);font-size:12px;margin:0 0 10px}
textarea{font:inherit;border-radius:7px;border:1px solid var(--line);
  background:#121826;color:var(--fg);padding:6px 9px;width:100%;box-sizing:border-box;
  resize:none;height:52px}
button{font:inherit;border-radius:7px;border:1px solid var(--line);
  background:#121826;color:var(--fg);padding:6px 9px;width:100%;margin-top:6px;cursor:pointer}
button.go{background:var(--accent);color:#221503;border:none;font-weight:600}
button:disabled{opacity:.5;cursor:default}
#goalfacts{font:12px/1.6 ui-monospace,Menlo,monospace;margin-top:8px;color:var(--dim);
  white-space:pre-wrap}
#goalfacts .fact{color:var(--fg)}
#plan .step{color:var(--fg)}
#plan .add{color:var(--open)}
#plan .del{color:var(--shut)}
#plan .bad{color:var(--shut)}
#plan .muted{color:var(--dim)}
#vocab{left:16px;right:auto;top:calc(16px + env(safe-area-inset-top,0px));
  max-height:calc(100vh - 64px);overflow-y:auto}
#vocab[data-open="0"] #vocabbody{display:none}
#vocab h1{cursor:pointer;user-select:none}
#vocabbody{font:12px/1.6 ui-monospace,Menlo,monospace;margin-top:8px}
#vocabbody .tabs{display:flex;gap:6px;flex-wrap:wrap}
#vocabbody .tabs button{width:auto;padding:3px 9px;cursor:pointer;font-size:12px}
#vocabbody .tabs button.on{background:var(--accent);color:#221503;border-color:var(--accent)}
#vocabbody .sec{color:var(--accent);margin:8px 0 2px;font-weight:600}
#vocabbody .sym{color:var(--fg)}
#vocabbody .desc{color:var(--dim);margin-left:14px;white-space:pre-wrap}
#vocabbody .rule{color:var(--fg);margin-top:4px}
#vocabbody .body{color:var(--dim);margin-left:14px}
#state{left:16px;right:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));
  max-height:44vh;overflow-y:auto;font:12px/1.6 ui-monospace,Menlo,monospace}
#state[data-open="0"] #statebody{display:none}
#state h1{cursor:pointer;user-select:none;font-family:"Golos Text",system-ui,sans-serif}
#statebody .sec{color:var(--accent);margin:8px 0 2px;font-weight:600}
#statebody .row{display:flex;justify-content:space-between;gap:6px}
#statebody .x{width:auto;margin:0;padding:0 6px;border:none;background:none;color:var(--shut)}
#statebody .err{color:var(--shut);white-space:pre-wrap}
#statebody .hint{color:var(--dim)}
#statebody input,#statebody select{font:inherit;width:100%;box-sizing:border-box;margin-top:4px;
  border-radius:6px;border:1px solid var(--line);background:#121826;color:var(--fg);padding:4px 6px}
.steprow{display:flex;gap:6px;margin-top:6px}
.steprow input{font:inherit;width:56px;border-radius:7px;border:1px solid var(--line);
  background:#121826;color:var(--fg);padding:6px 9px;box-sizing:border-box}
.steprow button{margin-top:0}
#tl{position:fixed;left:340px;right:340px;bottom:calc(16px + env(safe-area-inset-bottom,0px));
  z-index:2;font:12px/1.6 ui-monospace,Menlo,monospace}
#timeline{display:flex;gap:6px;overflow-x:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;backdrop-filter:blur(6px)}
#timeline .rec{flex:none;color:var(--dim);cursor:pointer;white-space:nowrap;
  border:1px solid var(--line);border-radius:7px;padding:2px 8px}
#timeline .rec:hover{color:var(--fg)}
#timeline .rec.on{color:#221503;background:var(--accent);border-color:var(--accent)}
#tldetail{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;margin-bottom:6px;max-height:46vh;overflow-y:auto;backdrop-filter:blur(6px)}
#tldetail .head{display:flex;justify-content:space-between;color:var(--fg);font-weight:600}
#tldetail .x,#tldetail .full{cursor:pointer;user-select:none}
#tldetail .full{color:var(--accent);margin-top:6px}
#tldetail .step{color:var(--fg)}
#tldetail .add{color:var(--open)}
#tldetail .del{color:var(--shut)}
#tldetail .muted{color:var(--dim)}
#tldetail .sec{color:var(--dim);margin-top:6px;font-weight:600}
#tldetail .derived{color:var(--accent)}
@media (max-width:640px){.card{width:calc(100vw - 32px)}}
</style>
<link rel="stylesheet" href="demo.css">

<canvas id="c"></canvas>

<div class="card" id="ctrl">
  <h1>Hostel</h1>
  <p class="sub">a world made of modules · the UI only draws</p>
  <textarea id="goaltext" placeholder="goal as text, e.g. Ann holds the pan"></textarea>
  <button id="parse">Parse: text → goal state</button>
  <div id="goalfacts" hidden></div>
  <button class="go" id="run" disabled>Run: plan and execute</button>
  <div class="steprow"><input id="stepn" type="number" min="1" value="1"><button id="step">Step</button></div>
  <button id="reset">Reset world</button>
  <p class="sub" style="margin:8px 0 0">click a door to edit the state · drag to rotate, wheel to zoom</p>
</div>

<div class="card" id="vocab" data-open="0">
  <h1 id="vocabtoggle">Vocabulary and rules ▸</h1>
  <div id="vocabbody"></div>
</div>

<div class="card" id="state" data-open="0">
  <h1 id="statetoggle">State ▸</h1>
  <div id="statebody">
    <div id="stateerr" class="err"></div>
    <div class="sec">new triple</div>
    <input id="fr" list="dl_rel" placeholder="rel / prop / kind">
    <input id="fx" list="dl_ent" placeholder="entity">
    <input id="fy" list="dl_val" placeholder="value or entity">
    <button id="addfact">add triple</button>
    <div class="sec">new entity</div>
    <input id="nid" placeholder="id, e.g. alice">
    <select id="nkind"></select>
    <select id="nfloor" hidden><option value="0">floor 0</option><option value="1">floor 1</option><option value="2">floor 2</option></select>
    <div id="npos" class="hint" hidden>place: click the scene where it stands</div>
    <button id="addent">create entity</button>
    <div class="sec">triples</div>
    <div id="factlist"></div>
  </div>
  <datalist id="dl_rel"></datalist><datalist id="dl_ent"></datalist><datalist id="dl_val"></datalist>
</div>

<div class="card" id="plan"><span class="muted">waiting for a goal…</span></div>

<div id="tl">
  <div id="tldetail" hidden></div>
  <div id="timeline"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="data.js"></script>
<script src="replay.js"></script>
<script src="scene.js"></script>
<script src="demo.js"></script>
